name: Testes

on:
  pull_request:
    branches:
      - main

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest
